<!--  nav bar -->

<nav class="bg-neutral-50/50 backdrop-blur-md sticky w-full z-20 top-0 border-b border-default">
  <div class="max-w-7xl mx-auto p-4 flex flex-wrap items-center justify-between">
    <a routerLink="/" class="flex items-center space-x-3">
      <img
        width="48"
        height="48"
        src="https://img.icons8.com/sf-regular/48/shopping-cart-loaded.png"
        alt="shopping-cart-loaded"
      />
      <span class="text-xl font-semibold text-heading">Store</span>
    </a>

    <div class="flex items-center gap-2 md:order-2">
      <button
        aria-label="Open search"
        class="p-2 w-10 h-10 flex items-center justify-center rounded-base text-body hover:text-heading hover:bg-neutral-secondary-soft focus:ring-2 focus:ring-neutral-tertiary"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="m21 21-3.5-3.5M17 10a7 7 0 1 1-14 0 7 7 0 0 1 14 0Z" />
        </svg>
      </button>

      <a
        *ngIf="isLoggedIn"
        routerLink="/cart"
        class="hidden md:inline-flex relative px-3 py-2 text-sm font-medium text-heading rounded-xl hover:bg-neutral-secondary-soft"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13 5.4 5M7 13l-1 5h12m-9 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Zm8 0a1 1 0 1 0 0 2 1 1 0 0 0 0-2Z" />
        </svg>
        <span
          *ngIf="cartItemsCount > 0"
          class="absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-red-600 text-white text-xs flex items-center justify-center"
        >
          {{ cartItemsCount }}
        </span>
      </a>

      <details *ngIf="isLoggedIn" class="hidden md:relative md:block">
        <summary
          class="list-none px-3 py-2 text-sm font-medium text-heading rounded-xl hover:bg-neutral-secondary-soft cursor-pointer flex items-center gap-2"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Zm-11.356 13.5a8.25 8.25 0 0 1 15.712 0" />
          </svg>
          {{ userName }}
        </summary>

        <ul class="absolute right-0 mt-2 min-w-44 bg-white border border-default rounded-base shadow-md p-2 z-30">
          <li><a routerLink="/profile" class="block px-3 py-2 rounded hover:bg-neutral-secondary-soft">Profile</a></li>
          <li><a routerLink="/orders" class="block px-3 py-2 rounded hover:bg-neutral-secondary-soft">Orders</a></li>
          <li *ngIf="isAdmin"><a routerLink="/admin" class="block px-3 py-2 rounded hover:bg-neutral-secondary-soft">Admin</a></li>
          <li><button (click)="logout()" class="w-full text-left px-3 py-2 rounded hover:bg-neutral-secondary-soft">Logout</button></li>
        </ul>
      </details>

      <a
        *ngIf="!isLoggedIn"
        routerLink="/login"
        class="hidden md:inline-flex px-4 py-2 text-sm font-medium text-heading rounded-xl hover:bg-neutral-secondary-soft"
      >
        Login
      </a>

      <a
        *ngIf="!isLoggedIn"
        routerLink="/register"
        class="hidden md:inline-flex px-4 py-2 text-sm font-medium text-white bg-black rounded-xl hover:opacity-90"
      >
        Sign up
      </a>

      <button
        aria-label="Open menu"
        type="button"
        class="md:hidden p-2 w-10 h-10 flex items-center justify-center rounded-base text-body hover:bg-neutral-secondary-soft focus:ring-2 focus:ring-neutral-tertiary"
        [attr.aria-expanded]="menuOpen"
        (click)="toggleMenu()"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" d="M5 7h14M5 12h14M5 17h14" />
        </svg>
      </button>
    </div>

    <div id="navbar-menu" class="w-full md:flex md:w-auto md:order-1 text-gray-600" [class.hidden]="!menuOpen">
      <ul
        class="flex flex-col gap-2 p-4 mt-4 border border-default rounded-base bg-neutral-secondary-soft md:flex-row md:items-center md:gap-8 md:p-0 md:mt-0 md:border-0 md:bg-transparent"
      >
        <li><a routerLink="/" class="nav-link hover:text-black">Home</a></li>
        <li><a routerLink="/products" class="nav-link hover:text-black">Products</a></li>

        <li class="relative" *ngIf="categories.length > 0">
          <details>
            <summary class="nav-link hover:text-black cursor-pointer list-none">Categories</summary>
            <ul class="mt-2 md:absolute md:min-w-44 md:bg-white md:border md:border-default md:rounded-base md:p-2">
              <li *ngFor="let c of categories">
                <a
                  routerLink="/products"
                  [queryParams]="{ category: c.id }"
                  class="block px-2 py-1 hover:bg-neutral-secondary-soft rounded"
                >
                  {{ c.name }}
                </a>
              </li>
            </ul>
          </details>
        </li>

        <li class="md:hidden border-t border-default pt-3 mt-2" *ngIf="!isLoggedIn">
          <a routerLink="/login" class="block py-2 text-heading">Login</a>
          <a routerLink="/register" class="block py-2 mt-2 text-center text-white bg-brand rounded-base">Sign up</a>
        </li>

        <li class="md:hidden border-t border-default pt-3 mt-2" *ngIf="isLoggedIn">
          <a routerLink="/profile" class="block py-2 text-heading">Profile</a>
          <a routerLink="/orders" class="block py-2 text-heading">Orders</a>
          <a *ngIf="isAdmin" routerLink="/admin" class="block py-2 text-heading">Admin</a>
          <a routerLink="/cart" class="block py-2 text-heading">Cart ({{ cartItemsCount }})</a>
          <button (click)="logout()" class="block w-full text-left py-2 text-heading">Logout</button>
        </li>
      </ul>
    </div>
  </div>
</nav>
